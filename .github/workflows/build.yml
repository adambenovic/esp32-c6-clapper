name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4.0

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Merge binaries into single flashable .bin
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd build
          esptool.py --chip esp32c6 merge_bin \
            -o firmware-merged.bin \
            --flash_mode dio \
            --flash_size 4MB \
            @flash_args

      - name: Upload firmware artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/firmware-merged.bin

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware-merged.bin
